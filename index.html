<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gemini 雙軌雙語同傳系統</title>
  <style>
    :root {
      --bg: #121316;
      --card-bg: #1e2025;
      --accent-live: #00d26a;
      --accent-deep: #4da3ff;
      --accent-export: #3a3f4d;
      --text: #f0f2f5;
      --text-sub: #9aa0a6;
      --border: #2e323b;
      --content-font-size: 15px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 10px;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      gap: 8px;
    }
    header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 12px;
      flex-shrink: 0;
    }
    details summary {
      font-size: 13px;
      color: var(--text-sub);
      cursor: pointer;
      user-select: none;
      margin-bottom: 6px;
    }
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 6px;
    }
    .full-width { grid-column: span 2; }
    .config-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 12px; color: var(--text-sub); }
    input, select {
      background: #0f1013;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
      width: 100%;
    }
    .range-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .range-group input[type="range"] {
      flex: 1;
      padding: 0;
      accent-color: var(--accent-deep);
    }
    .range-val { font-size: 12px; width: 45px; text-align: right; color: var(--text-sub); }
    
    .controls {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    button {
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    #btn-toggle {
      flex: 2;
      background: var(--accent-live);
      color: #000;
    }
    #btn-toggle.recording {
      background: #ff4757;
      color: #fff;
    }
    #btn-export {
      flex: 1;
      background: var(--accent-export);
      color: #fff;
      border: 1px solid var(--border);
    }
    #btn-export:active {
      opacity: 0.8;
    }

    .status-bar {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
    }
    .debug-log {
      font-size: 11px;
      color: #e6a23c;
      background: #2b2515;
      padding: 4px 8px;
      border-radius: 4px;
      margin-top: 6px;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 48px;
      overflow-y: auto;
    }

    /* 雙軌容器 - 動態比例調整 */
    .grid-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-height: 0;
    }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      transition: flex 0.1s ease;
    }
    #panelLive { flex: 50; }
    #panelDeep { flex: 50; }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: bold;
      flex-shrink: 0;
    }
    .tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 8px;
      font-weight: normal;
    }
    .tag-live { background: rgba(0, 210, 106, 0.15); color: var(--accent-live); }
    .tag-deep { background: rgba(77, 163, 255, 0.15); color: var(--accent-deep); }
    .content-box {
      flex: 1;
      overflow-y: auto;
      background: #0f1013;
      border-radius: 6px;
      padding: 10px;
      font-size: var(--content-font-size);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .chunk-card {
      border-left: 3px solid var(--accent-deep);
      background: rgba(77, 163, 255, 0.05);
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 4px;
    }

    /* 頁尾版本標記 */
    footer {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2px 0;
      font-size: 11px;
      color: var(--text-sub);
      opacity: 0.85;
      letter-spacing: 0.5px;
    }
    .ver-badge {
      background: #1e2025;
      border: 1px solid var(--border);
      padding: 2px 10px;
      border-radius: 12px;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <header>
    <details>
      <summary>⚙️ 展開／收合偏好設定（模型、語言、版面比例、字級）</summary>
      <div class="settings-grid">
        <!-- 目標語言 -->
        <div class="config-group">
          <label for="targetLanguage">翻譯目標語言：</label>
          <select id="targetLanguage">
            <option value="繁體中文" selected>繁體中文</option>
            <option value="簡體中文">簡體中文</option>
            <option value="日文">日文</option>
            <option value="英文">英文</option>
          </select>
        </div>

        <!-- 第一層 Live 模型 -->
        <div class="config-group">
          <label for="liveModelSelect">第一層 Live 模型：</label>
          <select id="liveModelSelect">
            <option value="models/gemini-2.0-flash" selected>Gemini 3.5 Live Translate (預設)</option>
            <option value="models/gemini-2.5-flash">Gemini 3.5 Live (2.5-Flash 核心)</option>
            <option value="models/gemini-2.0-flash-realtime-exp">Gemini 2.0 Realtime Exp</option>
          </select>
        </div>

        <!-- 第二層精翻模型 -->
        <div class="config-group">
          <label for="modelSelect">第二層精翻模型：</label>
          <select id="modelSelect">
            <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash (預設推薦)</option>
            <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
            <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
            <option value="gemini-3.0-flash">Gemini 3.0 Flash</option>
            <option value="gemini-2.5-pro">Gemini 2.5 Pro (深度分析)</option>
            <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
            <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
          </select>
        </div>

        <!-- 切片時間（預設 10 秒） -->
        <div class="config-group">
          <label for="chunkDurationSelect">第二層切片頻率：</label>
          <select id="chunkDurationSelect">
            <option value="10" selected>每 10 秒硬切片 (預設)</option>
            <option value="20">每 20 秒硬切片</option>
            <option value="30">每 30 秒硬切片</option>
            <option value="60">每 60 秒硬切片</option>
          </select>
        </div>

        <!-- 字級大小 -->
        <div class="config-group">
          <label>字級大小：</label>
          <div class="range-group">
            <input type="range" id="fontSizeRange" min="12" max="26" value="15" />
            <span class="range-val" id="fontSizeVal">15px</span>
          </div>
        </div>

        <!-- 視窗高度比例 -->
        <div class="config-group full-width">
          <label>兩層高度比例 (第1層 / 第2層)：</label>
          <div class="range-group">
            <input type="range" id="ratioRange" min="20" max="80" value="50" />
            <span class="range-val" id="ratioVal">5:5</span>
          </div>
        </div>

        <!-- API KEY -->
        <div class="config-group full-width">
          <label for="apiKey">Gemini API Key：</label>
          <input type="password" id="apiKey" placeholder="若程式內未寫死，請在此貼上 Key" />
        </div>
      </div>
    </details>

    <div class="controls">
      <button id="btn-toggle">啟動雙軌同傳系統</button>
      <button id="btn-export" type="button">匯出記錄</button>
    </div>

    <div class="status-bar">
      <span id="liveStatus">第一軌：待機</span>
      <span id="chunkTimer">第二軌切片倒數：10s</span>
    </div>
    <div class="debug-log" id="debugLog">日誌：等待啟動...</div>
  </header>

  <div class="grid-container">
    <!-- 第一軌 -->
    <div class="panel" id="panelLive">
      <div class="panel-header">
        <span>第一層：即時同傳 (原文 + 括號翻譯)</span>
        <span class="tag tag-live" id="liveModelTag">Live WS</span>
      </div>
      <div class="content-box" id="liveOutput">等待語音輸入...（說完一句話稍微停頓約 1 秒即可送出）</div>
    </div>

    <!-- 第二軌 -->
    <div class="panel" id="panelDeep">
      <div class="panel-header">
        <span id="deepPanelTitle">第二層：10 秒硬切精翻</span>
        <span class="tag tag-deep" id="deepModelTag">Gemini 2.5 Flash</span>
      </div>
      <div class="content-box" id="deepOutput">等待硬切音訊處理...</div>
    </div>
  </div>

  <!-- 頁尾版本標記 -->
  <footer>
    <span class="ver-badge" id="appVersion">v1.6.0 (2026.09.02-r3)</span>
  </footer>

  <script>
    // ========================================================
    // 若要固定 Key 免重複輸入，可直接在此填入（GitHub 倉庫請設為 Private）
    // ========================================================
    const HARDCODED_API_KEY = ""; 

    let isRunning = false;
    let isSetupComplete = false;
    let audioContext = null;
    let micStream = null;
    let scriptProcessor = null;
    let liveSocket = null;
    let pcmChunkBuffer = [];
    let countdownInterval = null;
    let chunkDuration = 10;
    let timeLeft = 10;

    const apiKeyInput = document.getElementById('apiKey');
    const targetLangSelect = document.getElementById('targetLanguage');
    const liveModelSelect = document.getElementById('liveModelSelect');
    const modelSelect = document.getElementById('modelSelect');
    const chunkDurationSelect = document.getElementById('chunkDurationSelect');
    const btnToggle = document.getElementById('btn-toggle');
    const btnExport = document.getElementById('btn-export');
    const liveStatus = document.getElementById('liveStatus');
    const chunkTimer = document.getElementById('chunkTimer');
    const liveOutput = document.getElementById('liveOutput');
    const deepOutput = document.getElementById('deepOutput');
    const debugLog = document.getElementById('debugLog');
    const deepPanelTitle = document.getElementById('deepPanelTitle');
    const deepModelTag = document.getElementById('deepModelTag');
    const liveModelTag = document.getElementById('liveModelTag');

    const panelLive = document.getElementById('panelLive');
    const panelDeep = document.getElementById('panelDeep');
    const fontSizeRange = document.getElementById('fontSizeRange');
    const fontSizeVal = document.getElementById('fontSizeVal');
    const ratioRange = document.getElementById('ratioRange');
    const ratioVal = document.getElementById('ratioVal');

    function log(msg) {
      debugLog.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      console.log(msg);
    }

    if (HARDCODED_API_KEY) apiKeyInput.value = HARDCODED_API_KEY;
    else if (localStorage.getItem('gemini_key')) apiKeyInput.value = localStorage.getItem('gemini_key');
    apiKeyInput.addEventListener('change', () => localStorage.setItem('gemini_key', apiKeyInput.value.trim()));

    // 字級調整
    fontSizeRange.addEventListener('input', (e) => {
      const size = e.target.value;
      fontSizeVal.textContent = `${size}px`;
      document.documentElement.style.setProperty('--content-font-size', `${size}px`);
    });

    // 視窗比例
    ratioRange.addEventListener('input', (e) => {
      const liveRatio = parseInt(e.target.value, 10);
      const deepRatio = 100 - liveRatio;
      panelLive.style.flex = liveRatio;
      panelDeep.style.flex = deepRatio;
      ratioVal.textContent = `${Math.round(liveRatio/10)}:${Math.round(deepRatio/10)}`;
    });

    // 標籤更新
    modelSelect.addEventListener('change', () => { deepModelTag.textContent = modelSelect.value; });
    liveModelSelect.addEventListener('change', () => { liveModelTag.textContent = liveModelSelect.value.replace('models/', ''); });

    // 切片時間切換
    chunkDurationSelect.addEventListener('change', () => {
      chunkDuration = parseInt(chunkDurationSelect.value, 10);
      timeLeft = chunkDuration;
      chunkTimer.textContent = `第二軌切片倒數：${timeLeft}s`;
      deepPanelTitle.textContent = `第二層：${chunkDuration} 秒硬切精翻`;
    });

    // 主啟動 / 停止開關
    btnToggle.addEventListener('click', async () => {
      const key = apiKeyInput.value.trim() || HARDCODED_API_KEY;
      if (!isRunning) {
        if (!key) return alert('請先填入 API Key！');
        try {
          chunkDuration = parseInt(chunkDurationSelect.value, 10);
          timeLeft = chunkDuration;
          await startProcessing(key);
          btnToggle.textContent = '停止收音';
          btnToggle.classList.add('recording');
          isRunning = true;
          if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(() => {});
        } catch (err) {
          log(`啟動失敗: ${err.message}`);
        }
      } else {
        btnToggle.textContent = '啟動雙軌同傳系統';
        btnToggle.classList.remove('recording');
        isRunning = false;
        await stopProcessing(key); // 停止時自動觸發殘留語音上傳
      }
    });

    async function startProcessing(apiKey) {
      liveOutput.textContent = '';
      deepOutput.textContent = '';
      pcmChunkBuffer = [];
      isSetupComplete = false;
      const targetLang = targetLangSelect.value;
      const liveModelName = liveModelSelect.value;
      liveModelTag.textContent = liveModelName.replace('models/', '');
      deepModelTag.textContent = modelSelect.value;

      // 1. 初始化音訊環境
      audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }
      log(`AudioContext 取樣率: ${audioContext.sampleRate}Hz`);

      // 2. 獲取麥克風（關閉降噪收環境與廣播音）
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
          channelCount: 1,
          sampleRate: 16000
        }
      });

      // 3. Web Audio 分流管線
      const source = audioContext.createMediaStreamSource(micStream);
      scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);
      source.connect(scriptProcessor);
      scriptProcessor.connect(audioContext.destination);

      scriptProcessor.onaudioprocess = (e) => {
        if (!isRunning) return;
        const inputData = e.inputBuffer.getChannelData(0);

        const pcm16 = new Int16Array(inputData.length);
        for (let i = 0; i < inputData.length; i++) {
          let s = Math.max(-1, Math.min(1, inputData[i]));
          pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }

        // 分支 1：即時串流給 WebSocket
        if (liveSocket && liveSocket.readyState === WebSocket.OPEN && isSetupComplete) {
          try {
            const base64Audio = int16ToBase64(pcm16);
            liveSocket.send(JSON.stringify({
              realtimeInput: {
                mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: base64Audio }]
              }
            }));
          } catch (e) {}
        }

        // 分支 2：第二軌持續累積音訊
        pcmChunkBuffer.push(pcm16);
      };

      // 4. 第二軌切片計時器立即啟動
      startChunkTimer(apiKey);

      // 5. 第一軌非同步啟動
      try {
        initGeminiLiveWebSocket(apiKey, targetLang, liveModelName);
      } catch (err) {
        log(`第一軌啟動警告: ${err.message}`);
        liveStatus.textContent = '第一軌：未啟動（第二軌正常運行）';
      }
    }

    // 第一軌：WebSocket 即時同傳（格式：原文 (翻譯)）
    function initGeminiLiveWebSocket(apiKey, targetLang, liveModelName) {
      log(`正在建立第一軌連線 (${liveModelName})...`);
      isSetupComplete = false;
      const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${apiKey}`;
      liveSocket = new WebSocket(wsUrl);

      liveSocket.onopen = () => {
        log(`第一軌連線建立，發送 Setup...`);
        liveStatus.textContent = '第一軌：協商中...';
        
        liveSocket.send(JSON.stringify({
          setup: {
            model: liveModelName,
            generationConfig: { 
              responseModalities: ["TEXT"] 
            },
            systemInstruction: {
              parts: [{ 
                text: `你是專業同傳口譯。請將聽到的每一句原文先完整寫出，緊接著在半形括號內附上${targetLang}翻譯。格式嚴格為：「原文 (翻譯後的${targetLang})」。不要輸出任何多餘寒暄、解釋或標註。` 
              }]
            }
          }
        }));
      };

      liveSocket.onmessage = async (event) => {
        try {
          let rawData = event.data;
          if (rawData instanceof Blob) rawData = await rawData.text();
          const res = JSON.parse(rawData);

          if (res.setupComplete) {
            isSetupComplete = true;
            log('握手成功 (setupComplete)！第一軌即時同傳開始。');
            liveStatus.textContent = '第一軌：即時同傳中';
            return;
          }

          const parts = res.serverContent?.modelTurn?.parts;
          if (parts && parts.length > 0) {
            for (let part of parts) {
              if (part.text) {
                liveOutput.textContent += part.text + " ";
                liveOutput.scrollTop = liveOutput.scrollHeight;
              }
            }
          }
        } catch (err) {
          log(`第一軌解析通知: ${err.message}`);
        }
      };

      liveSocket.onerror = () => { log('第一軌連線異常'); };
      liveSocket.onclose = (e) => {
        isSetupComplete = false;
        log(`第一軌已關閉 (代碼: ${e.code}) - 第二軌不受影響繼續運作`);
        liveStatus.textContent = '第一軌：已停止（第二軌正常運行）';
      };
    }

    function startChunkTimer(apiKey) {
      clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        timeLeft--;
        chunkTimer.textContent = `第二軌切片倒數：${timeLeft}s`;
        if (timeLeft <= 0) {
          timeLeft = chunkDuration;
          sendAudioChunkToDeepAPI(apiKey, chunkDuration);
        }
      }, 1000);
    }

    // 第二軌：自選模型硬切精翻（格式：原文 (翻譯)）
    async function sendAudioChunkToDeepAPI(apiKey, durationSec) {
      if (pcmChunkBuffer.length === 0) return;

      const currentChunks = [...pcmChunkBuffer];
      pcmChunkBuffer = [];
      const targetLang = targetLangSelect.value;
      const selectedModel = modelSelect.value;

      let totalLength = currentChunks.reduce((acc, c) => acc + c.length, 0);
      let mergedPcm = new Int16Array(totalLength);
      let offset = 0;
      for (let c of currentChunks) {
        mergedPcm.set(c, offset);
        offset += c.length;
      }

      const wavBlob = encodeWAV(mergedPcm, 16000);
      const base64Wav = await blobToBase64(wavBlob);

      const timeTag = new Date().toLocaleTimeString();
      const card = document.createElement('div');
      card.className = 'chunk-card';
      card.innerHTML = `<div style="font-size:11px;color:#9aa0a6;">[${timeTag}] ${durationSec}s 音訊分析中 (${selectedModel})...</div><div>處理中...</div>`;
      deepOutput.prepend(card);

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { 
                  text: `這是過去 ${durationSec} 秒的環境/廣播錄音。請辨識所有講話與廣播內容並忽略雜訊。輸出格式要求：\n1. 【雙語對照】：每一句原文後面緊跟半形括號附上${targetLang}翻譯，格式為：原文 (${targetLang}翻譯)。\n2. 【重點摘要】：以${targetLang}條列 1~3 點關鍵廣播要點與核心資訊。` 
                },
                { inlineData: { mimeType: "audio/wav", data: base64Wav } }
              ]
            }]
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error?.message || `HTTP ${response.status}`);
        }

        const data = await response.json();
        const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text || '無有效語音。';
        card.innerHTML = `<div style="font-size:11px;color:#4da3ff;">[${timeTag}] ${durationSec}s 切片精翻完成 (${selectedModel})</div><div>${resultText}</div>`;
      } catch (err) {
        card.innerHTML = `<div style="color:#ff6b6b;">[${timeTag}] 切片失敗 (${selectedModel}): ${err.message}</div>`;
      }
    }

    // 停止處理流程：自動上傳殘留語音
    async function stopProcessing(apiKey) {
      clearInterval(countdownInterval);
      isSetupComplete = false;
      if (liveSocket) liveSocket.close();
      if (scriptProcessor) scriptProcessor.disconnect();
      if (audioContext) audioContext.close();
      if (micStream) micStream.getTracks().forEach(track => track.stop());
      
      liveStatus.textContent = '第一軌：待機';
      chunkTimer.textContent = `第二軌切片倒數：${chunkDuration}s`;

      // 檢查是否有未滿週期的殘留語音（超過 0.5 秒即自動上傳）
      if (pcmChunkBuffer.length > 2) {
        const totalSamples = pcmChunkBuffer.reduce((acc, c) => acc + c.length, 0);
        const leftoverSec = Math.max(1, Math.round(totalSamples / 16000));
        log(`正在上傳並分析最後殘留的 ${leftoverSec} 秒音訊...`);
        await sendAudioChunkToDeepAPI(apiKey, leftoverSec);
      } else {
        pcmChunkBuffer = [];
      }
      log('錄音已完全停止。');
    }

    // 匯出完整翻譯結果為 Markdown 檔案
    btnExport.addEventListener('click', () => {
      const liveText = liveOutput.textContent.trim();
      
      // 提取第二層所有已完成的卡片內容（畫面為 prepend 倒序，匯出時翻轉為時間正序）
      const cards = Array.from(deepOutput.querySelectorAll('.chunk-card'));
      cards.reverse();
      const deepText = cards.map(c => c.innerText.trim()).join('\n\n---\n\n');

      if (!liveText && !deepText) {
        return alert('目前尚無任何翻譯內容可供匯出！');
      }

      const now = new Date();
      const exportContent = `# Gemini 雙軌同傳與精翻記錄
- 匯出時間：${now.toLocaleString()}
- 目標語言：${targetLangSelect.value}
- 第二層模型：${modelSelect.value}

==================================================
【第一層：即時同傳記錄 (Live)】
==================================================
${liveText || '(無內容)'}

==================================================
【第二層：硬切精翻與摘要記錄 (Deep)】
==================================================
${deepText || '(無內容)'}
`;

      const blob = new Blob([exportContent], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const timeTag = now.toISOString().replace(/[:.]/g, '-').slice(0, 19);
      a.href = url;
      a.download = `Gemini_Translation_${timeTag}.md`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      log('翻譯結果已成功匯出！');
    });

    function int16ToBase64(int16Array) {
      let binary = '';
      const bytes = new Uint8Array(int16Array.buffer);
      const len = bytes.byteLength;
      for (let i = 0; i < len; i++) binary += String.fromCharCode(bytes[i]);
      return window.btoa(binary);
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    function encodeWAV(samples, sampleRate) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);
      const writeString = (v, o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint28(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(view, 36, 'data');
      view.setUint32(40, samples.length * 2, true);
      let offset = 44;
      for (let i = 0; i < samples.length; i++, offset += 2) {
        view.setInt16(offset, samples[i], true);
      }
      return new Blob([view], { type: 'audio/wav' });
    }
  </script>
