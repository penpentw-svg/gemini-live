<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gemini 雙軌同傳與硬切摘要系統</title>
  <style>
    :root {
      --bg: #121316;
      --card-bg: #1e2025;
      --accent-live: #00d26a;
      --accent-deep: #4da3ff;
      --text: #f0f2f5;
      --text-sub: #9aa0a6;
      --border: #2e323b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 100vh;
    }
    header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 12px;
    }
    .config-group { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 13px; color: var(--text-sub); }
    input, select {
      background: #0f1013;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      width: 100%;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    button {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    #btn-toggle { background: var(--accent-live); color: #000; }
    #btn-toggle.recording { background: #ff4757; color: #fff; }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 6px;
    }
    .countdown-box {
      background: #0f1013;
      border-radius: 6px;
      height: 6px;
      overflow: hidden;
      margin-top: 6px;
    }
    .countdown-bar {
      height: 100%;
      width: 100%;
      background: var(--accent-deep);
      transition: width 1s linear;
    }
    .grid-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      height: 40vh;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }
    .tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: normal;
    }
    .tag-live { background: rgba(0, 210, 106, 0.15); color: var(--accent-live); }
    .tag-deep { background: rgba(77, 163, 255, 0.15); color: var(--accent-deep); }
    .content-box {
      flex: 1;
      overflow-y: auto;
      background: #0f1013;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .chunk-card {
      border-left: 3px solid var(--accent-deep);
      background: rgba(77, 163, 255, 0.05);
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 4px;
      font-size: 13px;
    }
    .chunk-time { font-size: 11px; color: var(--text-sub); margin-bottom: 4px; }
  </style>
</head>
<body>

  <header>
    <div class="config-group">
      <label for="apiKey">Gemini API Key：</label>
      <input type="password" id="apiKey" placeholder="請貼上你的 Gemini API Key" />
    </div>
    <div class="controls">
      <button id="btn-toggle">啟動雙軌收音與翻譯</button>
    </div>
    <div class="countdown-box"><div class="countdown-bar" id="progressBar"></div></div>
    <div class="status-bar">
      <span id="liveStatus">第一軌狀態：待機</span>
      <span id="chunkTimer">第二軌切片倒數：60s</span>
    </div>
  </header>

  <div class="grid-container">
    <div class="panel">
      <div class="panel-header">
        <span>第一層：即時同傳 (毫秒級)</span>
        <span class="tag tag-live">Gemini Live WS</span>
      </div>
      <div class="content-box" id="liveOutput">等待音訊串流輸入...</div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span>第二層：60秒硬切精翻與摘要</span>
        <span class="tag tag-deep">Gemini 2.5 Flash</span>
      </div>
      <div class="content-box" id="deepOutput">等待首個 60 秒音訊切片回傳...</div>
    </div>
  </div>

  <script>
    let isRunning = false;
    let audioContext = null;
    let micStream = null;
    let scriptProcessor = null;
    let liveSocket = null;
    let pcmChunkBuffer = []; // 累積 60 秒的 PCM 音訊
    let countdownInterval = null;
    let timeLeft = 60;

    const apiKeyInput = document.getElementById('apiKey');
    const btnToggle = document.getElementById('btn-toggle');
    const liveStatus = document.getElementById('liveStatus');
    const chunkTimer = document.getElementById('chunkTimer');
    const progressBar = document.getElementById('progressBar');
    const liveOutput = document.getElementById('liveOutput');
    const deepOutput = document.getElementById('deepOutput');

    // 讀取/儲存 LocalStorage 中的 Key
    if (localStorage.getItem('gemini_key')) {
      apiKeyInput.value = localStorage.getItem('gemini_key');
    }
    apiKeyInput.addEventListener('change', () => {
      localStorage.setItem('gemini_key', apiKeyInput.value.trim());
    });

    // 主開關
    btnToggle.addEventListener('click', async () => {
      if (!isRunning) {
        const key = apiKeyInput.value.trim();
        if (!key) return alert('請先填入 Gemini API Key！');
        try {
          await startProcessing(key);
          btnToggle.textContent = '停止收音';
          btnToggle.classList.add('recording');
          isRunning = true;
          // 防止 iPhone 待機休眠
          if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(() => {});
        } catch (err) {
          alert('啟動失敗: ' + err.message);
        }
      } else {
        stopProcessing();
        btnToggle.textContent = '啟動雙軌收音與翻譯';
        btnToggle.classList.remove('recording');
        isRunning = false;
      }
    });

    async function startProcessing(apiKey) {
      liveOutput.textContent = '';
      deepOutput.textContent = '';
      timeLeft = 60;
      pcmChunkBuffer = [];

      // 1. 取得麥克風串流 (關閉降噪以收錄廣播與環境遠場音)
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
          channelCount: 1,
          sampleRate: 16000
        }
      });

      audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      const source = audioContext.createMediaStreamSource(micStream);

      // 2. 初始化第一軌：Gemini Live WebSocket
      initGeminiLiveWebSocket(apiKey);

      // 3. Web Audio 分流器 (單一輸入，兩路分派)
      scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);
      source.connect(scriptProcessor);
      scriptProcessor.connect(audioContext.destination);

      scriptProcessor.onaudioprocess = (e) => {
        if (!isRunning) return;
        const inputData = e.inputBuffer.getChannelData(0);

        // 轉換 Float32 為 Int16 PCM
        const pcm16 = new Int16Array(inputData.length);
        for (let i = 0; i < inputData.length; i++) {
          let s = Math.max(-1, Math.min(1, inputData[i]));
          pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }

        // 分支 A：串流至 Live WebSocket (轉 Base64)
        if (liveSocket && liveSocket.readyState === WebSocket.OPEN) {
          const base64Audio = int16ToBase64(pcm16);
          liveSocket.send(JSON.stringify({
            realtimeInput: {
              mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: base64Audio }]
            }
          }));
        }

        // 分支 B：存入硬切緩衝池
        pcmChunkBuffer.push(pcm16);
      };

      // 4. 啟動 60 秒硬切定時器
      startChunkTimer(apiKey);
    }

    // 第一軌：WebSocket 連線管理
    function initGeminiLiveWebSocket(apiKey) {
      liveStatus.textContent = '第一軌：連線中...';
      const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${apiKey}`;
      liveSocket = new WebSocket(wsUrl);

      liveSocket.onopen = () => {
        liveStatus.textContent = '第一軌：即時同傳中';
        // 發送初始握手設定 (System Prompt)
        liveSocket.send(JSON.stringify({
          setup: {
            model: "models/gemini-2.0-flash-exp",
            generationConfig: { responseModalities: ["TEXT"] },
            systemInstruction: {
              parts: [{ text: "你是毫秒級即時同傳員。將所有聽到的語言立即翻譯為繁體中文，保持精練，不要包含額外寒暄。" }]
            }
          }
        }));
      };

      liveSocket.onmessage = (event) => {
        try {
          const res = JSON.parse(event.data);
          const text = res.serverContent?.modelTurn?.parts?.[0]?.text;
          if (text) {
            liveOutput.textContent += text;
            liveOutput.scrollTop = liveOutput.scrollHeight;
          }
        } catch (e) {}
      };

      liveSocket.onerror = () => { liveStatus.textContent = '第一軌：連線異常'; };
      liveSocket.onclose = () => { liveStatus.textContent = '第一軌：已關閉'; };
    }

    // 第二軌：每 60 秒硬切片計時器
    function startChunkTimer(apiKey) {
      countdownInterval = setInterval(() => {
        timeLeft--;
        chunkTimer.textContent = `第二軌切片倒數：${timeLeft}s`;
        progressBar.style.width = `${(timeLeft / 60) * 100}%`;

        if (timeLeft <= 0) {
          timeLeft = 60;
          sendAudioChunkToDeepAPI(apiKey);
        }
      }, 1000);
    }

    // 第二軌：打包 WAV 並呼叫 Gemini REST API
    async function sendAudioChunkToDeepAPI(apiKey) {
      if (pcmChunkBuffer.length === 0) return;

      // 複製當前 60 秒音訊並清空緩衝區
      const currentChunks = [...pcmChunkBuffer];
      pcmChunkBuffer = [];

      // 合併所有 Int16Array
      let totalLength = currentChunks.reduce((acc, c) => acc + c.length, 0);
      let mergedPcm = new Int16Array(totalLength);
      let offset = 0;
      for (let c of currentChunks) {
        mergedPcm.set(c, offset);
        offset += c.length;
      }

      // 包裝成標準 WAV
      const wavBlob = encodeWAV(mergedPcm, 16000);
      const base64Wav = await blobToBase64(wavBlob);

      const timeTag = new Date().toLocaleTimeString();
      const card = document.createElement('div');
      card.className = 'chunk-card';
      card.innerHTML = `<div class="chunk-time">[${timeTag}] 60秒切片分析中...</div><div>辨識中...</div>`;
      deepOutput.prepend(card);

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                {
                  text: "這是過去 60 秒的環境/廣播錄音（背景可能嘈雜或有遠處播音）。請忽略雜音，完成兩項任務：\n1. 【完整精確翻譯】：翻譯所有出現的人聲或廣播為繁體中文。\n2. 【重點摘要】：條列整理關鍵資訊、播報要點與待辦事項。"
                },
                {
                  inlineData: { mimeType: "audio/wav", data: base64Wav }
                }
              ]
            }]
          })
        });

        const data = await response.json();
        const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text || '無有效語音或無法辨識。';
        card.innerHTML = `<div class="chunk-time">[${timeTag}] 60秒切片完成</div><div>${resultText}</div>`;
      } catch (err) {
        card.innerHTML = `<div class="chunk-time">[${timeTag}] 切片分析失敗</div><div style="color:#ff6b6b;">${err.message}</div>`;
      }
    }

    function stopProcessing() {
      clearInterval(countdownInterval);
      if (liveSocket) liveSocket.close();
      if (scriptProcessor) scriptProcessor.disconnect();
      if (audioContext) audioContext.close();
      if (micStream) micStream.getTracks().forEach(track => track.stop());
      progressBar.style.width = '100%';
      liveStatus.textContent = '第一軌狀態：已停止';
    }

    // 工具函式：PCM Int16 轉 Base64 (串流用)
    function int16ToBase64(int16Array) {
      let binary = '';
      const bytes = new Uint8Array(int16Array.buffer);
      const len = bytes.byteLength;
      for (let i = 0; i < len; i++) binary += String.fromCharCode(bytes[i]);
      return window.btoa(binary);
    }

    // 工具函式：Blob 轉 Base64 (REST API 用)
    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    // 工具函式：封裝標準單聲道 16-bit WAV Header
    function encodeWAV(samples, sampleRate) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);
      const writeString = (v, o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };

      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM
      view.setUint16(22, 1, true); // Mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(view, 36, 'data');
      view.setUint32(40, samples.length * 2, true);

      let offset = 44;
      for (let i = 0; i < samples.length; i++, offset += 2) {
        view.setInt16(offset, samples[i], true);
      }
      return new Blob([view], { type: 'audio/wav' });
    }
  </script>
</body>
</html>
