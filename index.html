<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>雙子座同聲傳譯 v3.4.1</title>
<style>
:root{--bg:#0b1020;--panel:#121a2b;--panel2:#182235;--text:#eef2ff;--muted:#9aa7bd;--line:#2a3750;--accent:#60a5fa;--danger:#b91c1c;--warn:#f59e0b;--ok:#34d399;--radius:14px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif}body{min-height:100vh}.container{max-width:1200px;margin:auto;padding:14px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.brand h1{font-size:21px;margin:0}.version{font-size:11px;color:var(--muted);margin-top:2px}.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}.dot{width:9px;height:9px;border-radius:50%;background:#64748b}.dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.controls{display:flex;gap:7px}.controls button,button{border:0;border-radius:10px;padding:9px 11px;background:#26344d;color:#fff;font:inherit;cursor:pointer}.controls button{font-size:13px;white-space:nowrap}.controls button:disabled,button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#2563eb!important}.stop{background:var(--danger)!important}.small{font-size:12px;padding:7px 9px}
.settings,.debug{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:10px}.settings[hidden],.debug[hidden]{display:none}.settings-title{padding:10px 14px;font-weight:700;border-bottom:1px solid var(--line)}.settings-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:12px 14px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--muted)}.field input,.field select{width:100%;background:#0e1626;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit}.note{font-size:11px;color:var(--warn);line-height:1.45}
.workspace{display:flex;flex-direction:column;gap:10px;min-height:72vh}.track{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;min-height:300px;flex:1}.track-head{position:relative;display:flex;align-items:center;gap:10px;padding:10px 14px 13px;background:var(--panel2);border-bottom:1px solid var(--line)}.track-title{font-weight:700;font-size:17px}.badge{font-size:12px;color:var(--muted);margin-left:auto}.track2-right{margin-left:auto;display:flex;align-items:center;gap:8px}.chunk-count{font-size:11px;color:var(--muted);white-space:nowrap}.track-progress{position:absolute;bottom:0;left:0;right:0;height:4px;background:#263247}.bar{height:100%;width:0;background:var(--accent);transition:width .15s linear}.bar.due{background:var(--warn)}.output{min-height:260px;padding:14px;overflow:auto;white-space:pre-wrap;line-height:1.65;flex:1}.live{font-size:18px}.interim{color:#93c5fd;opacity:.9}.entry{padding:7px 0;border-bottom:1px solid rgba(42,55,80,.65)}.entry:last-child{border-bottom:0}.entry-time{font-size:10px;color:var(--muted);margin-bottom:2px}.entry-original{opacity:.68}.entry-translation{color:var(--accent);margin-top:1px}.second-card{border-bottom:1px solid var(--line);padding:10px 0}.second-card:last-child{border-bottom:0}.second-time{font-size:11px;color:var(--muted);margin-bottom:5px}
.debug-head{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--panel2)}.debug-head div{display:flex;gap:6px}.log{height:190px;overflow:auto;padding:10px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;color:#cbd5e1}.footer{font-size:11px;color:var(--muted);padding:8px 2px}
@media(max-width:760px){.topbar{align-items:flex-start;flex-direction:column}.topbar-right{width:100%;justify-content:space-between}.controls{width:100%}.controls button{flex:1;padding:9px 4px}.settings-grid{grid-template-columns:1fr 1fr}.live{font-size:16px}}@media(max-width:430px){.settings-grid{grid-template-columns:1fr}.track-title{font-size:16px}.badge{font-size:11px}}
</style>
</head>
<body>
<div class="container">
<header class="topbar"><div class="brand"><h1>雙子座同聲傳譯</h1><div class="version">Version 3.4.2 · Gemini API v1beta</div></div><div class="topbar-right"><div class="status"><span id="statusDot" class="dot"></span><span id="statusText">待機</span></div><div class="controls"><button id="startBtn" class="primary">🎙 啟動</button><button id="stopBtn" class="stop" disabled>■ 停止</button><button id="exportBtn" disabled>⇩ 匯出</button><button id="logBtn">☷ 日誌</button><button id="settingsBtn">⚙ 設定</button></div></div></header>
<section id="settings" class="settings" hidden><div class="settings-title">⚙ 設定</div><div class="settings-grid"><div class="field"><label>目標語言</label><select id="targetLanguage"><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></div><div class="field"><label>第一軌模型</label><select id="track1Model"><option value="gemini-3.5-live-translate-preview">gemini-3.5-live-translate-preview</option><option value="gemini-3.5-transcribe-live">gemini-3.5-transcribe-live</option></select></div><div class="field"><label>第二軌模型</label><select id="track2Model"><option value="gemini-3.6-flash">gemini-3.6-flash</option><option value="gemini-2.5-flash">gemini-2.5-flash</option></select></div><div class="field"><label>第二軌切片（秒）</label><select id="chunkDuration"><option value="10">10</option><option value="20">20</option><option value="30">30</option><option value="60">60</option></select></div><div class="field"><label>字級</label><input id="fontSize" type="range" min="12" max="26" value="16"></div><div class="field"><label>第一軌高度比例</label><input id="layoutRatio" type="range" min="20" max="80" value="50"></div><div class="field" style="grid-column:span 2"><label>Gemini API Key（只儲存在本機）</label><input id="apiKey" type="password" autocomplete="off" placeholder="AIza..."></div><div class="field" style="grid-column:1/-1"><div class="note">⚠ 請勿把含有真實 API Key 的 HTML 上傳至公開 GitHub。</div></div></div></section>
<main class="workspace"><section id="track1" class="track"><div class="track-head"><span class="track-title">第一軌 · 即時翻譯</span><span class="badge">⚡ Gemini Live</span></div><div id="track1Output" class="output live"><span class="interim">等待收音…</span></div></section><section id="track2" class="track"><div class="track-head"><span class="track-title">第二軌 · 切片精翻</span><span class="track2-right"><span id="progressText" class="chunk-count">0 / 10 秒</span><span class="badge">🧠 Gemini REST</span></span><div class="track-progress"><div id="progressBar" class="bar"></div></div></div><div id="track2Output" class="output"><span class="interim">第二軌會在第一個切片完成後出現。</span></div></section></main>
<section id="debugPanel" class="debug" hidden><div class="debug-head"><strong>除錯日誌</strong><div><button id="clearLogBtn" class="small">清除</button><button id="copyLogBtn" class="small">複製</button></div></div><div id="log" class="log"></div></section><div class="footer">v3.4.2「雙子座同聲傳譯」：第一軌每一句均永久追加，並含時間、原文及翻譯。</div>
</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),WS_BASE='wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent',REST_BASE='https://generativelanguage.googleapis.com/v1beta/models',LS='gemini_twin_v341';
const els={start:$('startBtn'),stop:$('stopBtn'),export:$('exportBtn'),logBtn:$('logBtn'),settingsBtn:$('settingsBtn'),settings:$('settings'),debug:$('debugPanel'),copy:$('copyLogBtn'),clear:$('clearLogBtn'),api:$('apiKey'),target:$('targetLanguage'),model1:$('track1Model'),model2:$('track2Model'),duration:$('chunkDuration'),font:$('fontSize'),ratio:$('layoutRatio'),t1:$('track1Output'),t2:$('track2Output'),bar:$('progressBar'),ptext:$('progressText'),log:$('log'),dot:$('statusDot'),status:$('statusText'),track1:$('track1'),track2:$('track2')};
let ws=null,wsReady=false,running=false,stopping=false,audioContext=null,mediaStream=null,sourceNode=null,processor=null,wakeLock=null,chunkParts=[],chunkSamples=0,chunkTimer=null,progressTimer=null,chunkStartedAt=0,track1Final=[],track2Results=[],currentOriginal='',currentTranslation='',lastTranscriptAt=0,pendingAudioQueue=[],allLogs=[],secondQueue=[],secondSending=false,chunkIndex=0,reconnects=0,reconnectTimer=null,watchdogTimer=null;
function log(msg,level='INFO'){const line=`[${new Date().toLocaleTimeString()}] [${level}] ${msg}`;allLogs.push(line);const d=document.createElement('div');d.textContent=line;els.log.appendChild(d);els.log.scrollTop=els.log.scrollHeight;console.log(line)}
function setStatus(t,on=false){els.status.textContent=t;els.dot.classList.toggle('on',on)}
function save(){localStorage.setItem(LS,JSON.stringify({api:els.api.value,target:els.target.value,m1:els.model1.value,m2:els.model2.value,d:els.duration.value,f:els.font.value,r:els.ratio.value}))}
function load(){try{const x=JSON.parse(localStorage.getItem(LS)||'{}');if(x.api)els.api.value=x.api;if(x.target)els.target.value=x.target;if(x.m1)els.model1.value=x.m1;if(x.m2)els.model2.value=x.m2;if(x.d)els.duration.value=x.d;if(x.f)els.font.value=x.f;if(x.r)els.ratio.value=x.r}catch{}applyVisual()}
function applyVisual(){els.t1.style.fontSize=els.font.value+'px';els.t2.style.fontSize=els.font.value+'px';els.track1.style.flex=els.ratio.value+' 1 0';els.track2.style.flex=(100-Number(els.ratio.value))+' 1 0';els.ptext.textContent='0 / '+els.duration.value+' 秒'}
[els.api,els.target,els.model1,els.model2,els.duration,els.font,els.ratio].forEach(e=>e.addEventListener('change',()=>{save();applyVisual()}));
function b64(buf){const a=new Uint8Array(buf),step=0x8000;let out='';for(let i=0;i<a.length;i+=step)out+=String.fromCharCode(...a.subarray(i,Math.min(i+step,a.length)));return btoa(out)}
function pcm16(a){const o=new Int16Array(a.length);for(let i=0;i<a.length;i++){const x=Math.max(-1,Math.min(1,a[i]));o[i]=x<0?x*0x8000:x*0x7fff}return o.buffer}
function resample(a,rate){if(rate===16000)return a;const r=rate/16000,o=new Float32Array(Math.round(a.length/r));for(let i=0;i<o.length;i++){const st=Math.floor(i*r),en=Math.min(a.length,Math.max(st+1,Math.floor((i+1)*r)));let sum=0;for(let j=st;j<en;j++)sum+=a[j];o[i]=sum/(en-st)}return o}
function wav(parts){let n=0;for(const p of parts)n+=p.byteLength;const b=new ArrayBuffer(44+n),v=new DataView(b),w=(o,x)=>{for(let i=0;i<x.length;i++)v.setUint8(o+i,x.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,16000,true);v.setUint32(28,32000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n,true);let o=44;for(const p of parts){new Uint8Array(b,o,p.byteLength).set(new Uint8Array(p));o+=p.byteLength}return b}
async function eventText(x){if(typeof x==='string')return x;if(x instanceof Blob)return await x.text();if(x instanceof ArrayBuffer)return new TextDecoder().decode(x);return ''}
function emitEntry(original,translation,interim=false){
  if(!original&&!translation)return;
  track1Final.push({time:new Date().toISOString(),original:String(original||''),translation:String(translation||'')});
  currentOriginal='';currentTranslation='';render1();els.export.disabled=false;
}
function commitCurrent(reason=''){if(currentOriginal||currentTranslation){emitEntry(currentOriginal,currentTranslation);if(reason)log(`第一軌句子已封存：${reason}`,'DEBUG')}}
function render1(){els.t1.innerHTML='';for(const x of track1Final){const e=document.createElement('div');e.className='entry';const tm=document.createElement('div');tm.className='entry-time';tm.textContent=new Date(x.time).toLocaleTimeString();const o=document.createElement('div');o.className='entry-original';o.textContent=x.original||'[無原文]';const t=document.createElement('div');t.className='entry-translation';t.textContent=x.translation?`（${x.translation}）`:'（翻譯等待中）';e.append(tm,o,t);els.t1.appendChild(e)}if(currentOriginal||currentTranslation){const e=document.createElement('div');e.className='entry interim';const o=document.createElement('div');o.textContent=currentOriginal||'辨識中…';const t=document.createElement('div');t.className='entry-translation';t.textContent=currentTranslation?`（${currentTranslation}）`:'（翻譯中…）';e.append(o,t);els.t1.appendChild(e)}els.t1.scrollTop=els.t1.scrollHeight}
function sendAudio(p){if(!ws||ws.readyState!==WebSocket.OPEN||!wsReady){if(pendingAudioQueue.length<30)pendingAudioQueue.push(p.slice(0));return}try{ws.send(JSON.stringify({realtimeInput:{audio:{data:b64(p),mimeType:'audio/pcm;rate=16000'}}}))}catch(e){log(e.message,'ERROR')}}
function flushPending(){const q=pendingAudioQueue.splice(0);q.forEach(sendAudio);if(q.length)log(`已補送握手期間暫存音訊：${q.length} 塊。`)}
function openWS(){const key=els.api.value.trim(),model=els.model1.value;wsReady=false;ws=new WebSocket(WS_BASE+'?key='+encodeURIComponent(key));log('建立第一軌 WebSocket：'+model);ws.onopen=()=>{const setup={setup:{model:'models/'+model,generationConfig:{responseModalities:['TEXT'],translationConfig:{targetLanguageCode:els.target.value,echoTargetLanguage:false}},inputAudioTranscription:{languageCodes:[],mode:'VERBATIM'},outputAudioTranscription:{languageCodes:[els.target.value],mode:'VERBATIM'},realtimeInputConfig:{automaticActivityDetection:{startOfSpeechSensitivity:'START_SENSITIVITY_HIGH',prefixPaddingMs:100,endOfSpeechSensitivity:'END_SENSITIVITY_HIGH',silenceDurationMs:600}}}};ws.send(JSON.stringify(setup));log('WebSocket 已連線，發送 setup。')};ws.onmessage=async e=>{try{const d=JSON.parse(await eventText(e.data));if(d.setupComplete){wsReady=true;reconnects=0;flushPending();setStatus('收音中',true);log('setupComplete: true，第一軌開始接受音訊。');return}if(d.error){log(JSON.stringify(d.error),'ERROR');return}const c=d.serverContent;if(c?.interimInputTranscription?.text){
  const next=c.interimInputTranscription.text;
  if(currentOriginal&&next!==currentOriginal&&next.length<currentOriginal.length*.65)commitCurrent('新句子開始');
  currentOriginal=next;lastTranscriptAt=performance.now();render1();
}
if(c?.inputTranscription?.text){
  const next=c.inputTranscription.text;
  if(currentOriginal&&next!==currentOriginal&&next.length<currentOriginal.length*.8)commitCurrent('收到下一句原文');
  currentOriginal=next;lastTranscriptAt=performance.now();render1();
}
if(c?.outputTranscription?.text){currentTranslation=c.outputTranscription.text;lastTranscriptAt=performance.now();render1()}
if(c?.turnComplete||c?.generationComplete)commitCurrent('turn 完成')}catch(err){log('WebSocket JSON 解析失敗：'+err.message,'WARN')}};ws.onclose=e=>{wsReady=false;log(`WebSocket 關閉：code=${e.code}, reason=${e.reason||'(無)'}`,'WARN');if(running&&!stopping&&e.code!==1008){setTimeout(()=>{if(running)openWS()},1000)}};ws.onerror=()=>log('WebSocket onerror。','ERROR')}
function addChunk(p){chunkParts.push(p);chunkSamples+=p.byteLength/2}
function flushChunk(force=false){const sec=chunkSamples/32000;if(!sec||(!force&&sec<.5))return;const parts=chunkParts;chunkParts=[];chunkSamples=0;chunkStartedAt=performance.now();enqueueSecond(parts,sec,force)}
function enqueueSecond(parts,seconds,flush){const seq=++chunkIndex;secondQueue.push({parts,seconds,flush,seq});log(`第二軌 #${seq} 已進入佇列；目前佇列 ${secondQueue.length} 段。`);processSecond()}
async function sendSecond(x){const data=b64(wav(x.parts)),model=els.model2.value.trim(),prompt=`請直接聽取此 WAV，輸出有效 JSON，且只能輸出 JSON：{"original":"原始語言逐字稿","translation":"${els.target.value} 翻譯"}。背景聲可辨時加入 [背景音：描述]。`;log(`第二軌 #${x.seq} 送出 ${x.seconds.toFixed(1)} 秒 WAV，約 ${Math.round(data.length*.75/1024)} KB。`);try{const r=await fetch(`${REST_BASE}/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(els.api.value.trim())}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt},{inlineData:{mimeType:'audio/wav',data}}]}],generationConfig:{temperature:.2,responseMimeType:'application/json'}})}),raw=await r.text();if(!r.ok){log(`第二軌 #${x.seq} HTTP ${r.status}: ${raw.slice(0,900)}`,'ERROR');return}const d=JSON.parse(raw),txt=(d.candidates||[]).flatMap(c=>c.content?.parts||[]).map(p=>p.text||'').join('').trim();let pair;try{pair=JSON.parse(txt.replace(/^```json\s*|\s*```$/g,''))}catch{pair={original:'',translation:txt}}track2Results.push({time:new Date().toISOString(),seconds:x.seconds,original:String(pair.original||''),translation:String(pair.translation||'')});render2();els.export.disabled=false;log(`第二軌 #${x.seq} 精翻完成。`)}catch(e){log(`第二軌 #${x.seq} 失敗：${e.message}`,'ERROR')}}
async function processSecond(){if(secondSending)return;secondSending=true;while(secondQueue.length)await sendSecond(secondQueue.shift());secondSending=false}
function render2(){els.t2.innerHTML='';[...track2Results].reverse().forEach(x=>{const c=document.createElement('div');c.className='second-card';const tm=document.createElement('div');tm.className='second-time';tm.textContent=new Date(x.time).toLocaleTimeString()+' · '+x.seconds.toFixed(1)+' 秒';const o=document.createElement('div');o.className='entry-original';o.textContent=x.original||'[未取得原文]';const t=document.createElement('div');t.className='entry-translation';t.textContent=x.translation?`（譯）${x.translation}`:'（未取得翻譯）';c.append(tm,o,t);els.t2.appendChild(c)})}
function updateProgress(){if(!running){els.bar.style.width='0%';return}const d=Number(els.duration.value),e=(performance.now()-chunkStartedAt)/1000,p=Math.min(100,e/d*100);els.bar.style.width=p+'%';els.bar.classList.toggle('due',p>90);els.ptext.textContent=Math.min(d,e).toFixed(1)+' / '+d+' 秒'}
async function setupAudio(){mediaStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});audioContext=new (window.AudioContext||window.webkitAudioContext)();await audioContext.resume();sourceNode=audioContext.createMediaStreamSource(mediaStream);processor=audioContext.createScriptProcessor(4096,1,1);processor.onaudioprocess=e=>{if(!running)return;const p=pcm16(resample(e.inputBuffer.getChannelData(0),audioContext.sampleRate));sendAudio(p);addChunk(p)};sourceNode.connect(processor);processor.connect(audioContext.destination);log(`AudioContext sampleRate=${audioContext.sampleRate} Hz，輸出 16000 Hz Mono PCM16。`)}
async function start(){if(running)return;if(!window.isSecureContext)return alert('必須在 HTTPS 執行。');if(!els.api.value.trim()){els.settings.hidden=false;return alert('請先輸入 Gemini API Key。')}save();running=true;stopping=false;track1Final=[];track2Results=[];currentOriginal='';currentTranslation='';pendingAudioQueue=[];chunkParts=[];chunkSamples=0;secondQueue=[];secondSending=false;chunkIndex=0;els.t1.innerHTML='<span class="interim">連線中…</span>';els.t2.innerHTML='<span class="interim">等待第一個音訊切片…</span>';els.start.disabled=true;els.stop.disabled=false;els.export.disabled=true;chunkStartedAt=performance.now();try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen');openWS();await setupAudio();chunkTimer=setInterval(()=>flushChunk(),Number(els.duration.value)*1000);progressTimer=setInterval(updateProgress,100);log('系統啟動完成。')}catch(e){log(e.message,'ERROR');await stop()}}
async function stop(){if(!running)return;commitCurrent('停止前收尾');stopping=true;els.stop.disabled=true;els.stop.textContent='上傳中…';if(chunkTimer)clearInterval(chunkTimer);if(progressTimer)clearInterval(progressTimer);if(processor)processor.disconnect();if(sourceNode)sourceNode.disconnect();if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());if(audioContext)await audioContext.close();const sec=chunkSamples/32000;if(sec>.5)flushChunk(true);running=false;if(ws)ws.close();if(wakeLock)try{await wakeLock.release()}catch{}while(secondSending||secondQueue.length){els.stop.textContent=`上傳中… 剩 ${secondQueue.length} 段`;await new Promise(r=>setTimeout(r,200))}els.start.disabled=false;els.stop.disabled=true;els.stop.textContent='■ 停止';setStatus('已停止');updateProgress();log('所有服務已停止（第二軌已全部處理完畢）。');stopping=false}
function exportMd(){const a=['# 雙子座同聲傳譯','',`- 匯出：${new Date().toLocaleString()}`,'','## 第一軌'];track1Final.forEach(x=>a.push(`- ${new Date(x.time).toLocaleTimeString()} ${x.original}（${x.translation}）`));a.push('','## 第二軌');track2Results.forEach(x=>a.push(`- ${new Date(x.time).toLocaleTimeString()} ${x.original}（${x.translation}）`));const u=URL.createObjectURL(new Blob([a.join('\n')],{type:'text/markdown;charset=utf-8'})),e=document.createElement('a');e.href=u;e.download='gemini-interpretation.md';e.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
els.settingsBtn.onclick=()=>els.settings.hidden=!els.settings.hidden;els.logBtn.onclick=()=>els.debug.hidden=!els.debug.hidden;els.copy.onclick=async()=>{try{await navigator.clipboard.writeText(allLogs.join('\n'));log('除錯日誌已複製。')}catch(e){log('複製失敗：'+e.message,'ERROR')}};els.clear.onclick=()=>{els.log.innerHTML='';allLogs=[]};els.start.onclick=start;els.stop.onclick=stop;els.export.onclick=exportMd;load();log('v3.4.2「雙子座同聲傳譯」載入完成。');
})();
</script>
</body></html>
